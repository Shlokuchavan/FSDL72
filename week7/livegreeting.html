<!DOCTYPE html>
<html ng-app="greetApp">
<head>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-controller="GreetController">

  <h2>Live Greeting</h2>

  <input type="text" ng-model="user.firstName" placeholder="First Name" />
  <input type="text" ng-model="user.lastName" placeholder="Last Name" />

  <p>Hello, {{ user.firstName + ' ' + user.lastName }}!</p>

  <script>
    angular.module('greetApp', [])
      .controller('GreetController', function($scope) {
        $scope.user = {
          firstName: '',
          lastName: ''
        };
      });
  </script>

</body>
</html>
