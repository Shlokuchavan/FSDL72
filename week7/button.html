<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button ng-click="sayHello()">Click Me</button>
<p>{{message}}</p>

<script>
  $scope.sayHello = function() {
    $scope.message = "Hello from ng-click!";
  };
</script>

</body>
</html>
