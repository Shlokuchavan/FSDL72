<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Password Generator</title>
        <style>
            body {
                font-family: Arial;
                padding: 20px;
            }

            label {
                display: block;
                margin-top: 10px;
            }

            #password {
                margin-top: 20px;
                font-weight: bold;
                font-size: 18px;
            }
        </style>
    </head>

    <body>

        <h2>Random Password Generator</h2>

        <label>
            Length:
            <input type="number" id="length" min="4" max="50" value="12">
        </label>

        <label>
            <input type="checkbox" id="uppercase"> Include Uppercase
        </label>

        <label>
            <input type="checkbox" id="symbols"> Include Symbols
        </label>

        <button onclick="generatePassword()">Generate Password</button>

        <div id="password"></div>

        <script>
            function generatePassword() {
                const length = parseInt(document.getElementById("length").value);
                const includeUppercase = document.getElementById("uppercase").checked;
                const includeSymbols = document.getElementById("symbols").checked;

                let charset = "abcdefghijklmnopqrstuvwxyz0123456789";
                if (includeUppercase) charset += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                if (includeSymbols) charset += "!@#$%^&*()_+-=[]{}|;:,.<>?";

                let password = "";
                for (let i = 0; i < length; i++) {
                    const randomIndex = Math.floor(Math.random() * charset.length);
                    password += charset[randomIndex];
                }

                document.getElementById("password").textContent = "Generated Password: " + password;
            }
        </script>

    </body>

</html>
