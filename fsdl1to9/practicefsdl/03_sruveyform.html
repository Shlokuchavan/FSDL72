<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Survey Form</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <style>
            body {
                font-family: Arial, sans-serif;
                background: #f1f1f1;
                margin: 0;
                padding: 0;
            }

            .container {
                width: 90%;
                max-width: 600px;
                background: #fff;
                margin: 50px auto;
                padding: 30px;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }

            h1 {
                text-align: center;
                margin-bottom: 20px;
            }

            label,
            p {
                display: block;
                margin: 10px 0 5px;
            }

            input[type="text"],
            input[type="email"],
            input[type="number"],
            select {
                width: 100%;
                padding: 8px;
                margin-bottom: 15px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }

            button {
                display: block;
                width: 100%;
                background-color: #007BFF;
                color: white;
                border: none;
                padding: 12px;
                font-size: 16px;
                border-radius: 5px;
                cursor: pointer;
            }

            button:hover {
                background-color: #0056b3;
            }
        </style>

        <div class="container">
            <h1>Feedback Survey</h1>
            <form id="survey-form">
                <!-- Name -->
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <!-- Email -->
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <!-- Age -->
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="10" max="100" required>

                <!-- Preferences -->
                <label for="preference">Your favorite technology:</label>
                <select id="preference" name="preference">
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="react">React</option>
                </select>

                <!-- Ratings -->
                <p>How would you rate our content?</p>
                <label><input type="radio" name="rating" value="excellent"> Excellent</label>
                <label><input type="radio" name="rating" value="good"> Good</label>
                <label><input type="radio" name="rating" value="fair"> Fair</label>
                <label><input type="radio" name="rating" value="poor"> Poor</label>

                <!-- Submit -->
                <button type="submit">Submit</button>
            </form>
        </div>

    </body>

</html>
