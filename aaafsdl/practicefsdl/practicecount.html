<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>

    <body>
        <h1>Countdown Timer</h1>
        <input type="number" id="minutes" placeholder="minutes" min="0"><br>
        <input type="number" id="seconds" placeholder="seconds" min="0" max="59"><br>
        <button onclick="starttimer()">Start</button>
        <h1 id="display">00:00</h1>


        <script>
            let timer;
            function startimer() {
                clearInterval(timer);
                let min = parseInt(document.getElementById("minutes").value) || 0;
                let sec = parseInt(document.getElementById("seconds").value) || 0;
                let total = min * 60 + sec;

                if (total <= 0) return alert("Enter valid timer");

                timer = setInterval(() => {
                    let m = Math.floor(total / 60);
                    let s = total % 60;
                    document.getElementById('display').textContent =
                        `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

                    if (total-- <= 0) {
                        clearInterval(timer);
                        alert("Time is up ");
                    }




                }, 1000);
            }
        </script>
    </body>

</html>
