<!DOCTYPE html>
<html>
<head>
  <title>Add Student</title>
</head>
<body>
  <h2>Add Student</h2>
  <form action="/add" method="POST">

    <input name="name" required /><br><br>

    <input name="age" type="number" required /><br><br>
    <button type="submit">Add</button>
  </form>
</body>
</html>
